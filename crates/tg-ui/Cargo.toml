[package]
name = "tg-ui"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
egui = { workspace = true }
eframe = { workspace = true }
tg-emoji = { path = "../tg-emoji" }
tg-lottie = { path = "../tg-lottie" }
tg-style = { path = "../tg-style" }
tg-text = { path = "../tg-text" }
tg-theme = { path = "../tg-theme" }
tg-video = { path = "../tg-video" }
unicode-segmentation = "1.13"
image = { version = "0.25.9", default-features = false, features = ["png"], optional = true }

[features]
# Software egui rasterizer for tests that write documentation screenshots (`soft_raster`).
soft-raster = ["dep:image"]

[dev-dependencies]
image = { version = "0.25.9", default-features = false, features = ["png"] }
egui_kittest = { version = "0.37.0", features = ["snapshot", "wgpu"] }
