[package]
name = "tg-emoji"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Telegram Desktop emoji sprite atlas and egui inline emoji renderer for Rustgram"

[dependencies]
egui = "0.37.0"
image = { version = "0.25.9", default-features = false, features = ["png"] }
tg-text = { path = "../tg-text" }
thiserror = "2.0.11"

[build-dependencies]
ecolor = "0.37.0"
image = { version = "0.25.9", default-features = false, features = ["webp", "png"] }

[dev-dependencies]
image = { version = "0.25.9", default-features = false, features = ["webp", "png"] }
