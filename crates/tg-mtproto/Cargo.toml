[package]
name = "tg-mtproto"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
base64 = "0.22.1"
parking_lot = "0.12.5"
rand = "0.8.5"
reqwest = { version = "0.12.15", default-features = false, features = ["rustls-tls-webpki-roots", "charset"] }
serde_json = "1.0.138"
tg-crypto = { path = "../tg-crypto" }
tg-tl = { path = "../tg-tl" }
tg-transport = { path = "../tg-transport" }
thiserror = "2.0.12"
tokio = { version = "1.44.2", features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
tracing = "0.1.41"

[dev-dependencies]
num-bigint = "0.4.6"
num-traits = "0.2.19"
sha1 = "0.10.6"
sha2 = "0.10.8"
