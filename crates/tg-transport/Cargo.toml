[package]
name = "tg-transport"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
aes = "0.8.4"
base64 = "0.22.1"
crc32fast = "1.4.2"
ctr = "0.9.2"
hmac = "0.12.1"
rand = "0.8.5"
sha2 = "0.10.8"
subtle = "2.6.1"
thiserror = "2.0.12"
tokio = { version = "1.44.2", features = ["net", "io-util", "time", "sync", "rt", "macros"] }
tracing = "0.1.41"
url = "2.5.4"
x25519-dalek = { version = "2.0.1", features = ["static_secrets"] }

[dev-dependencies]
tokio = { version = "1.44.2", features = ["rt-multi-thread", "macros"] }
