[package]
name = "tg-wallet"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
aes-gcm = "0.10.3"
argon2 = "0.5.3"
base64 = "0.22.1"
bip39 = { version = "2.1.0", default-features = false, features = ["std"] }
crypto_box = { version = "0.9.1", features = ["salsa20"] }
ed25519-dalek = { version = "2.2.0", features = ["rand_core"] }
hex = "0.4.3"
hmac = "0.12.1"
pbkdf2 = { version = "0.12.2", default-features = false, features = ["hmac"] }
rand_core = { version = "0.6.4", features = ["getrandom"] }
reqwest = { version = "0.12.28", default-features = false, features = ["rustls-tls", "json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.10.9"
tg-api = { path = "../tg-api" }
tg-tl = { path = "../tg-tl" }
thiserror = "2.0.21"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt", "rt-multi-thread", "sync", "time"] }
url = "2.5.9"
zeroize = { version = "1.9.2", features = ["derive"] }

[dev-dependencies]
tg-fuzz = { path = "../tg-fuzz" }
tempfile = "3.27.0"
tg-crypto = { path = "../tg-crypto" }
tg-mtproto = { path = "../tg-mtproto" }
