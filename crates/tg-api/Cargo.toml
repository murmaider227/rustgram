[package]
name = "tg-api"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
rand = "0.8"
tg-crypto = { path = "../tg-crypto" }
tg-data = { path = "../tg-data" }
tg-lang = { path = "../tg-lang" }
tg-text = { path = "../tg-text" }
tg-tl = { path = "../tg-tl" }
thiserror = "2.0"
tokio = { version = "1.54", features = ["macros", "sync", "time"] }
tracing = "0.1"

[dev-dependencies]
num-bigint = "0.4"
tokio = { version = "1.54", features = ["rt", "sync", "time", "macros"] }
