[package]
name = "tg-app-history"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow = "1.0.104"
egui = { workspace = true }
image = { version = "0.25.9", default-features = false, features = ["png", "jpeg", "webp", "gif"] }
qrcode = { version = "0.14", default-features = false }
rfd = "0.15"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tg-app-core = { path = "../tg-app-core" }
tg-app-info = { path = "../tg-app-info" }
tg-app-settings = { path = "../tg-app-settings" }
tg-app-media = { path = "../tg-app-media" }
tg-audio = { path = "../tg-audio" }
tg-bots = { path = "../tg-bots" }
tg-chat = { path = "../tg-chat" }
tg-core = { path = "../tg-core" }
tg-data = { path = "../tg-data" }
tg-editor = { path = "../tg-editor" }
tg-emoji = { path = "../tg-emoji" }
tg-history = { path = "../tg-history" }
tg-iv = { path = "../tg-iv" }
tg-lang = { path = "../tg-lang" }
tg-lottie = { path = "../tg-lottie" }
tg-media = { path = "../tg-media" }
tg-platform = { path = "../tg-platform" }
tg-text = { path = "../tg-text" }
tg-tgw = { path = "../tg-tgw" }
tg-theme = { path = "../tg-theme" }
tg-tl = { path = "../tg-tl" }
tg-ui = { path = "../tg-ui" }
tg-video = { path = "../tg-video" }
tracing = "0.1.44"

[dev-dependencies]
eframe = { workspace = true }
egui_kittest = { version = "0.37.0", features = ["snapshot", "wgpu"] }
png = "0.18.1"
tempfile = "3.27.0"
tg-api = { path = "../tg-api" }
tg-app-live = { path = "../tg-app-live" }
tg-session = { path = "../tg-session" }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time"] }
winit = "0.30.13"
