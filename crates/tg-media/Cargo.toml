[package]
name = "tg-media"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
aes = "0.8"
bitflags = "2"
ctr = "0.9"
flate2 = "1"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif"] }
md-5 = "0.10"
rand = "0.8"
sha1 = "0.10"
sha2 = "0.10"
thiserror = "2"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
