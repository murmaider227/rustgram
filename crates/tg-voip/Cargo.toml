[package]
name = "tg-voip"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Telegram VoIP media engine: 1:1 audio/video calls (Opus, WebRTC AEC3/NS/AGC, Media Foundation camera/H.264, DXGI screen capture, MTProto-2.0 CTR) and group calls (ICE-lite, DTLS 1.2/SRTP, multi-SSRC mixer, broadcast chunks)."

[dependencies]
aec3 = "0.4.0"
aes = "0.8.4"
cpal = "0.18.2"
ctr = "0.9.2"
dimpl = { version = "0.9.0", default-features = false, features = ["rust-crypto"] }
hmac = "0.12.1"
opus-pure = "0.2.3"
p256 = { version = "0.14.0", features = ["ecdsa", "pkcs8"] }
rand = "0.8.8"
ringbuf = "0.6.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha1 = "0.10.7"
sha2 = "0.10.9"
tg-audio = { path = "../tg-audio" }
tg-calls = { path = "../tg-calls" }
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["macros", "net", "rt", "rt-multi-thread", "sync", "time"] }
tracing = "0.1.41"
webrtc-srtp = "0.17.3"

[target.'cfg(windows)'.dependencies]
windows-core = "0.62.2"
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_Media_MediaFoundation",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Ole",
    "Win32_System_Variant",
] }

[dev-dependencies]
tg-fuzz = { path = "../tg-fuzz" }
