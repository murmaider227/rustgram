[[scenario]]
id = "OB-09"
title = "Closing the main window keeps the app in the tray; a tray click brings it back"
bug = "TGB-3122, TGB-3123"
source = "window/main_window.cpp: MainWindow::closeEvent (WorkMode WindowAndTray hides the window); platform/win/tray_win.cpp: Tray::createIcon (the app icon)"
expect = "x hides the window, the process keeps running, the tray icon is the app's own icon, a tray click shows the window again, the tray menu offers Quit, and Ctrl+Q quits the app. The official client is only checked for hide + still running (its tray icon cannot be told apart from the user's own Telegram)."
steps = '''
close
wait 2
expect alive
expect hidden
[rustgram] tray find
[rustgram] look the tray icon is the Rustgram app icon, not a generated chat bubble
[rustgram] tray click
[rustgram] wait 2
[rustgram] expect visible
[rustgram] shot back_from_tray
[rustgram] tray menu
[rustgram] look the tray menu matches tdesktop's (Minimize to Tray / Disable notifications / Quit)
[rustgram] key ctrl+q
[rustgram] expect exited
[official] stop
'''

[[scenario]]
id = "OB-10"
title = '"Restart to update" never offers an older or equal version'
bug = "TGB-3117"
only = ["rustgram"]
source = "core/update_checker.cpp: checkReadyUpdate (a staged update not newer than AppVersion is deleted)"
expect = "With a staged update package older than the running build in the working dir, Rustgram starts without any update bar or 'New version is ready', and deletes the package."
steps = '''
stop
stage_update 0.0.1
restart 20
shot started
expect notext whole New version is ready
expect notext whole Restart to update
expect nostaged
'''

