[[scenario]]
id = "OB-05"
title = "Own userpic next to own messages in a group at a wide window"
bug = "TGB-3124"
source = "history/history_widget.cpp: HistoryWidget::recountChatWidth (wide at >= 880 px, window.style adaptiveChatWideWidth); history/view/history_view_message.cpp: Message::hasFromPhoto"
expect = "With a history column of 880 px or more the chat is wide: A's own messages sit on the left like B's, with A's userpic at the last message of a run. Narrower, they move right and the userpic goes."
steps = '''
size 1700 900
open Walk Supergroup
seek ${pair_seek}
shot wide
expect samecol "${own_run}" "${other_run}"
look the walk account's own messages sit on the left with its userpic at the last one of a run
size 1200 900
seek ${pair_seek}
shot narrow
expect rightof "${own_run}" "${other_run}"
'''

[[scenario]]
