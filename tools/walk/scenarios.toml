# Everyday scenarios of the walk. docs/SCENARIOS.md is generated from this file
# (python -I tools/walk/gen_docs.py). ONE step list per scenario, played by both clients; a line
# starting with [official] or [rustgram] runs on that client only. Step language: engine.py.
#
# Fixture chats (tools/walk/peer): Walk Supergroup, Walk Basic Group, Walk Channel, the private
# chat A <-> B (320+ messages; its title is ${peer}), Walk Archived Group, Saved Messages, folder
# "Walk". ${...} names come from the config's "vars": they depend on which account the clients run
# as ("main" a or b).
# Messages the clients send carry the marker "walk tmp" and are deleted after the run.

# ------------------------------------------------------------------------------------------------
# Owner-reported bugs (each one stays here so it cannot come back unnoticed)
# ------------------------------------------------------------------------------------------------

[[scenario]]
id = "OB-01"
title = 'Stories tooltip closes on its x'
bug = "TGB-3127"
source = "dialogs/dialogs_widget.cpp: Widget::setupStoriesToggle / Ui::ShowStoriesTooltip (dialogs/ui/dialogs_stories_list.cpp)"
expect = 'With an unseen story of B, the tooltip "Click here to view from ..." shows next to the stories userpics; a click on its x closes it and it stays closed.'
steps = '''
expect text list Click here to view
shot tooltip
click right_of:Click here to view:17:7
wait 1.5
shot closed
expect notext list Click here to view
'''

[[scenario]]
id = "OB-02"
title = '"is typing" appears when B types and goes away 6 s after B stops'
bug = "TGB-3128"
source = "data/data_send_action.cpp: SendActionManager::registerFor (kStatusShowClientsideTyping 6000 ms); history/view/history_view_top_bar_widget.cpp"
expect = "Header and chat-list row of Walk Peer B say \"typing\" while B types; both are back to normal about 6 s after B's last typing update."
steps = '''
open ${peer}
scroll history -150
peer {"op":"typing","chat":"pm"}
wait 1.5
shot typing
expect text header typing(\.|…|\s*$)
wait 8
shot stopped
expect notext header typing(\.|…|\s*$)
expect notext list typing(\.|…|\s*$)
'''

[[scenario]]
id = "OB-03"
title = '"is typing" goes away at once when B cancels typing'
bug = "TGB-3128"
source = "data/data_send_action.cpp: SendActionManager::registerFor (sendMessageCancelAction clears the action)"
expect = "After B's cancel the header shows the normal status within 2 s, no 6 s wait."
steps = '''
open ${peer}
scroll history -150
peer {"op":"typing","chat":"pm"}
wait 1.5
expect text header typing(\.|…|\s*$)
peer {"op":"cancel_typing","chat":"pm"}
