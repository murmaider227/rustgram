shot cancelled
expect notext header typing(\.|…|\s*$)
'''

[[scenario]]
id = "OB-04"
title = "\"is typing\" goes away when B's message arrives"
bug = "TGB-3128"
source = "history/history.cpp: History::clearSendAction on a new message from the typing user"
expect = 'B types, then sends: the message is shown and "typing" is gone from the header at once.'
