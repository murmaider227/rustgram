# Feature index for docs/CODEMAP.md (read by tools/codemap/gen.py).
#
# One [[feature]] per name an agent is likely to search for:
#   name     the heading; `aka` adds other names to it, so a search for them lands here too
#   terms    word prefixes matched against each file's path, `//!` module doc and public item
#            names; case, `_` and CamelCase do not matter ("sticker set" matches
#            `sticker_set_box.rs` and `StickerSetBox`); a path hit counts most
#   symbols  function names: the map lists the files that define them and the source files
#            that call them (use the backend trait methods: they lead to the trait, the live
#            implementation, the mocks and the UI caller in one line)
#   paths    repo-relative files that must be listed (pinned)
#   min_score  drop weaker matches (default 3)
#
# To extend: add a block, run `python -I -X utf8 tools/codemap/gen.py`, read the new section of
# docs/CODEMAP.md, tune terms or pin a path until the files are the right ones, commit both files.
# Keep it to features people name; per-file detail belongs in the file's `//!` doc.

