name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version without leading 'v' (e.g. 0.1.0-alpha.1 or 0.1.0)"
        required: true
        type: string

permissions:
  contents: write
  # Build provenance attestations for the release files (`gh attestation verify <file> -R murmaider227/rustgram`).
  id-token: write
  attestations: write

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  release-windows:
    name: Build & Stage Windows Release Draft
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust stable toolchain
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable

      - name: Cache Cargo registry and build artifacts
        # Only release runs save this key, and tag refs cannot read pull-request caches (pinned v2).
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # zizmor: ignore[cache-poisoning]
        with:
          # Stable key plus saving on failure: a re-run after a failed release reuses the compiled
          # dependencies instead of rebuilding them (~20 min).
          shared-key: release-windows
          cache-on-failure: true

      - name: Install Inno Setup 6
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          $isccDir = "${env:ProgramFiles(x86)}\Inno Setup 6"
          if (-not (Test-Path (Join-Path $isccDir "ISCC.exe"))) {
            $isccDir = "$env:ProgramFiles\Inno Setup 6"
          }
          if (-not (Test-Path (Join-Path $isccDir "ISCC.exe"))) {
            throw "ISCC.exe not found after installing Inno Setup"
          }
          Add-Content -Path $env:GITHUB_PATH -Value $isccDir

      - name: Setup FFmpeg shared development build
        uses: ./.github/actions/setup-ffmpeg

      - name: Resolve release metadata
        id: meta
        shell: pwsh
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if ($env:EVENT_NAME -eq "workflow_dispatch") {
            $version = $env:INPUT_VERSION -replace '^v', ''
            $tag = "v$version"
          } else {
            $tag = $env:GITHUB_REF_NAME
            $version = $tag -replace '^v', ''
          }
          if ($version -notmatch '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$') { throw "Bad version: $version" }
          $isPrerelease = if ($version -match '-') { "true" } else { "false" }
          $channel = if ($isPrerelease -eq "true") { "beta" } else { "stable" }
          Add-Content -Path $env:GITHUB_OUTPUT -Value "tag=$tag"
          Add-Content -Path $env:GITHUB_OUTPUT -Value "version=$version"
          Add-Content -Path $env:GITHUB_OUTPUT -Value "prerelease=$isPrerelease"
          Add-Content -Path $env:GITHUB_OUTPUT -Value "channel=$channel"

      - name: Require the updater public key
        shell: pwsh
        env:
          RUSTGRAM_UPDATE_PUBKEY: ${{ vars.RUSTGRAM_UPDATE_PUBKEY }}
        run: |
          if (-not $env:RUSTGRAM_UPDATE_PUBKEY) { throw 'Repository variable RUSTGRAM_UPDATE_PUBKEY is not set' }

      - name: Build distribution artifacts (portable zip, installer, update package)
        shell: pwsh
        env:
          RUSTGRAM_API_ID: ${{ secrets.RUSTGRAM_API_ID }}
          RUSTGRAM_API_HASH: ${{ secrets.RUSTGRAM_API_HASH }}
          RUSTGRAM_UPDATER_SIGNING_KEY: ${{ secrets.RUSTGRAM_UPDATER_SIGNING_KEY }}
          RUSTGRAM_UPDATE_PUBKEY: ${{ vars.RUSTGRAM_UPDATE_PUBKEY }}
          RELEASE_VERSION: ${{ steps.meta.outputs.version }}
          RELEASE_CHANNEL: ${{ steps.meta.outputs.channel }}
        run: |
          cargo run --release -p tg-xtask -- dist `
            --version "$env:RELEASE_VERSION" `
            --channel "$env:RELEASE_CHANNEL" `
            --out-dir dist `
            --require-iscc `
            --require-api-credentials

      - name: Verify expected release artifacts exist
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ steps.meta.outputs.version }}
        run: |
          $v = $env:RELEASE_VERSION
          $required = @(
            "dist/Rustgram-Setup-$v-win-x64.exe",
            "dist/rustgram-$v-win-x64-portable.zip",
            "dist/rustgram-$v-win-x64.tupdate",
            "dist/SHA256SUMS.txt"
          )
          foreach ($f in $required) {
            if (-not (Test-Path $f)) {
              throw "Expected release artifact missing: $f"
            }
          }
          Get-ChildItem dist

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/Rustgram-Setup-${{ steps.meta.outputs.version }}-win-x64.exe
            dist/rustgram-${{ steps.meta.outputs.version }}-win-x64-portable.zip
            dist/rustgram-${{ steps.meta.outputs.version }}-win-x64.tupdate

      - name: Create Draft GitHub Release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: Rustgram ${{ steps.meta.outputs.tag }}
          draft: true
          prerelease: ${{ steps.meta.outputs.prerelease }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/Rustgram-Setup-${{ steps.meta.outputs.version }}-win-x64.exe
            dist/rustgram-${{ steps.meta.outputs.version }}-win-x64-portable.zip
            dist/rustgram-${{ steps.meta.outputs.version }}-win-x64.tupdate
            dist/SHA256SUMS.txt
