# Builds the Windows release files and stages them as a DRAFT GitHub release (see docs/RELEASING.md).
#
# - A tag push `v<version>`, or a run dispatched ON that tag (`gh workflow run release.yml --ref v<version>
#   -f version=<version>`, the re-run of a failed tag build), builds the release and creates the draft.
#   The maintainer publishes the draft by hand.
# - A run dispatched on a branch is a TEST BUILD: same build and smoke test, files uploaded as a 7-day
#   workflow artifact, no attestation and no GitHub release, so it can never become an update candidate.
# - A stable version (no `-suffix`) is refused unless the same commit already shipped as a published
#   pre-release of the same version (v0.2.0 needs e.g. a published v0.2.0-beta.1 on that exact commit).
# - The release body is `.github/release-notes/v<version>.md`, required for stable releases.
# - A release (tag push, or a run dispatched on the tag) is refused unless the CI workflow succeeded for
#   the tagged commit; a CI run still in progress is waited for (up to 90 minutes). Test builds skip it.
name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version without leading 'v' (e.g. 0.1.0-alpha.1 or 0.1.0). Dispatch on the tag to (re)build a release; on a branch it is a test build without a release."
        required: true
        type: string

# Each job states what it needs.
permissions: {}

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # Two releases went out from commits whose CI was red (TGB-3133): only a commit with a green CI run
  # may become a release. Only runs on a tag can publish, so branch test builds skip this job.
  ci-green:
    name: Require green CI for the tagged commit
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 100
    permissions:
      actions: read
    steps:
      - name: Wait for the CI workflow of the tagged commit
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          started="$(date +%s)"
          while true; do
            runs="$(gh run list -R "$REPO" --workflow ci.yml --commit "$COMMIT" --limit 20 \
              --json status,conclusion,url)"
            if jq -e 'any(.[]; .status == "completed" and .conclusion == "success")' <<<"$runs" >/dev/null; then
              echo "CI succeeded for $COMMIT."
              exit 0
            fi
            elapsed=$(( $(date +%s) - started ))
            pending="$(jq 'map(select(.status != "completed")) | length' <<<"$runs")"
            total="$(jq 'length' <<<"$runs")"
            # A tag pushed together with its branch commit may arrive before CI registers its run.
            if [ "$pending" -eq 0 ] && { [ "$total" -gt 0 ] || [ "$elapsed" -ge 300 ]; }; then
              found="$(jq -r 'if length == 0 then "no CI run" else map("\(.conclusion) \(.url)") | join(", ") end' <<<"$runs")"
              echo "::error::Refusing to release $COMMIT: the CI workflow did not succeed for this commit (found: $found). Tag a commit whose CI is green; see docs/RELEASING.md."
              exit 1
            fi
            if [ "$elapsed" -ge 5400 ]; then
              echo "::error::CI for $COMMIT is still not finished after 90 minutes."
              exit 1
            fi
            echo "Waiting for CI of $COMMIT ($pending run(s) in progress, $total found)."
            sleep 60
          done

  release-windows:
    name: Build & Stage Windows Release Draft
    needs: ci-green
    # Runs after a green CI check, or without it for a branch test build (ci-green skipped).
    if: ${{ !cancelled() && (needs.ci-green.result == 'success' || needs.ci-green.result == 'skipped') }}
    runs-on: windows-latest
    permissions:
      contents: write
      # Build provenance attestations for the release files (`gh attestation verify <file> -R murmaider227/rustgram`).
      id-token: write
      attestations: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # All tags: the stable-release gate looks for pre-release tags on this commit.
          fetch-depth: 0

      - name: Resolve release metadata
        id: meta
        shell: pwsh
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if ($env:EVENT_NAME -eq "workflow_dispatch") {
            $version = $env:INPUT_VERSION -replace '^v', ''
            $tag = "v$version"
            # Only a run dispatched on the release tag itself may create a release. A run dispatched
            # on a branch is a test build: it never creates a release (drafts included).
            if ($env:REF_TYPE -eq "tag") {
              if ($env:REF_NAME -ne $tag) { throw "Dispatched on tag $env:REF_NAME but the version input is $version" }
              $publish = "true"
            } else {
              $publish = "false"
            }
          } else {
            $tag = $env:REF_NAME
            $version = $tag -replace '^v', ''
            $publish = "true"
          }
          if ($version -notmatch '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$') { throw "Bad version: $version" }
          $isPrerelease = if ($version -match '-') { "true" } else { "false" }
          $channel = if ($isPrerelease -eq "true") { "beta" } else { "stable" }
          Add-Content -Path $env:GITHUB_OUTPUT -Value "tag=$tag"
          Add-Content -Path $env:GITHUB_OUTPUT -Value "version=$version"
          Add-Content -Path $env:GITHUB_OUTPUT -Value "prerelease=$isPrerelease"
          Add-Content -Path $env:GITHUB_OUTPUT -Value "channel=$channel"
          Add-Content -Path $env:GITHUB_OUTPUT -Value "publish=$publish"
          if ($publish -ne "true") {
            Write-Host "::notice::Test build from $env:REF_NAME`: no GitHub release will be created."
          }

      - name: Stable releases ship only a commit that already shipped as a pre-release
        if: steps.meta.outputs.publish == 'true' && steps.meta.outputs.prerelease == 'false'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          VERSION: ${{ steps.meta.outputs.version }}
          COMMIT: ${{ github.sha }}
        run: |
          $prefix = "v$env:VERSION-"
          $tags = @(git tag --points-at $env:COMMIT | Where-Object { $_.StartsWith($prefix) })
          $shipped = @()
          foreach ($t in $tags) {
            $json = gh release view $t -R $env:REPO --json isDraft,isPrerelease 2>$null
            if ($LASTEXITCODE -ne 0 -or -not $json) { continue }
            $rel = $json | ConvertFrom-Json
            if (-not $rel.isDraft -and $rel.isPrerelease) { $shipped += $t }
          }
          if ($shipped.Count -eq 0) {
            $seen = if ($tags.Count) { $tags -join ', ' } else { 'none' }
            throw ("Refusing stable v$env:VERSION`: commit $env:COMMIT has no published pre-release " +
              "v$env:VERSION-* (pre-release tags on it: $seen). Ship this exact commit as an alpha or beta " +
              "first, then tag the same commit v$env:VERSION. See docs/RELEASING.md.")
          }
          Write-Host "Stable v$env:VERSION ships the commit of published pre-release(s): $($shipped -join ', ')"

      - name: Resolve release notes
        id: notes
        shell: pwsh
        env:
          TAG: ${{ steps.meta.outputs.tag }}
          PRERELEASE: ${{ steps.meta.outputs.prerelease }}
          REPO: ${{ github.repository }}
        run: |
          $file = ".github/release-notes/$env:TAG.md"
          if (Test-Path $file) {
            $text = Get-Content -Raw -Encoding utf8 $file
            if ($text -match 'RELEASE-NOTES-DRAFT') {
              throw "$file is still marked RELEASE-NOTES-DRAFT: review it and delete the marker line first."
            }
            $path = $file
          } elseif ($env:PRERELEASE -eq "true") {
            $path = Join-Path $env:RUNNER_TEMP "release-notes.md"
            $body = @(
              "Pre-release $env:TAG for testing (beta channel)."
              ""
              "Changes since the previous release: https://github.com/$env:REPO/commits/$env:TAG"
            ) -join "`n"
            Set-Content -Path $path -Value $body -Encoding utf8
            Write-Host "::warning::No $file; the draft uses the short pre-release default body."
          } else {
            throw "Stable release $env:TAG needs $file (copy .github/release-notes/TEMPLATE.md)."
          }
          Add-Content -Path $env:GITHUB_OUTPUT -Value "path=$path"

      - name: Install Rust stable toolchain
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable

      - name: Cache Cargo registry and build artifacts
        # Only release runs save this key, and tag refs cannot read pull-request caches (pinned v2).
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # zizmor: ignore[cache-poisoning]
        with:
          # Stable key plus saving on failure: a re-run after a failed release reuses the compiled
          # dependencies instead of rebuilding them (~20 min).
          shared-key: release-windows
          cache-on-failure: true

      - name: Install Inno Setup 6
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          $isccDir = "${env:ProgramFiles(x86)}\Inno Setup 6"
          if (-not (Test-Path (Join-Path $isccDir "ISCC.exe"))) {
            $isccDir = "$env:ProgramFiles\Inno Setup 6"
          }
          if (-not (Test-Path (Join-Path $isccDir "ISCC.exe"))) {
            throw "ISCC.exe not found after installing Inno Setup"
          }
          Add-Content -Path $env:GITHUB_PATH -Value $isccDir

      - name: Setup FFmpeg shared development build
        uses: ./.github/actions/setup-ffmpeg

      - name: Require the updater public key
        shell: pwsh
        env:
          RUSTGRAM_UPDATE_PUBKEY: ${{ vars.RUSTGRAM_UPDATE_PUBKEY }}
        run: |
          if (-not $env:RUSTGRAM_UPDATE_PUBKEY) { throw 'Repository variable RUSTGRAM_UPDATE_PUBKEY is not set' }

      - name: Build distribution artifacts (portable zip, installer, update package)
        shell: pwsh
        env:
          RUSTGRAM_API_ID: ${{ secrets.RUSTGRAM_API_ID }}
          RUSTGRAM_API_HASH: ${{ secrets.RUSTGRAM_API_HASH }}
          RUSTGRAM_UPDATER_SIGNING_KEY: ${{ secrets.RUSTGRAM_UPDATER_SIGNING_KEY }}
          RUSTGRAM_UPDATE_PUBKEY: ${{ vars.RUSTGRAM_UPDATE_PUBKEY }}
          RELEASE_VERSION: ${{ steps.meta.outputs.version }}
          RELEASE_CHANNEL: ${{ steps.meta.outputs.channel }}
        run: |
          cargo run --release -p tg-xtask -- dist `
            --version "$env:RELEASE_VERSION" `
            --channel "$env:RELEASE_CHANNEL" `
            --out-dir dist `
            --require-iscc `
            --require-api-credentials

      - name: Verify expected release artifacts exist
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ steps.meta.outputs.version }}
        run: |
          $v = $env:RELEASE_VERSION
          $required = @(
            "dist/Rustgram-Setup-$v-win-x64.exe",
            "dist/rustgram-$v-win-x64-portable.zip",
            "dist/rustgram-$v-win-x64.tupdate",
            "dist/SHA256SUMS.txt"
          )
          foreach ($f in $required) {
            if (-not (Test-Path $f)) {
              throw "Expected release artifact missing: $f"
            }
          }
          Get-ChildItem dist

      - name: Smoke test the packaged app (first start and an old profile)
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ steps.meta.outputs.version }}
        run: |
          $root = Join-Path $env:RUNNER_TEMP "smoke"
          $app = Join-Path $root "app"
          Expand-Archive -Path "dist/rustgram-$env:RELEASE_VERSION-win-x64-portable.zip" -DestinationPath $app
          $exe = Get-ChildItem -Path $app -Recurse -Filter rustgram.exe | Select-Object -First 1
          if (-not $exe) { throw "rustgram.exe not found in the portable zip" }
          # Every per-user data dir stays inside the scratch folder.
          $env:APPDATA = Join-Path $root "AppData"
          $env:LOCALAPPDATA = Join-Path $root "LocalAppData"
          # A profile written by v0.1.0-alpha.2. Never regenerate it (see its README.md).
          $fixture = "crates/tg-app/tests/fixtures/smoke_profile_v0_1_0_alpha_2/profile"
          $cases = @(
            @{ Name = "first start"; Dir = (Join-Path $root "fresh"); Copy = $null },
            @{ Name = "v0.1.0-alpha.2 profile"; Dir = (Join-Path $root "alpha2"); Copy = $fixture }
          )
          $failed = $false
          foreach ($case in $cases) {
            if ($case.Copy) {
              New-Item -ItemType Directory -Force -Path $case.Dir | Out-Null
              Copy-Item -Recurse -Path (Join-Path $case.Copy "*") -Destination $case.Dir
            }
            $smokeArgs = @("--smoke-test", "-workdir", "`"$($case.Dir)`"")
            $p = Start-Process -FilePath $exe.FullName -ArgumentList $smokeArgs -PassThru -NoNewWindow
            $null = $p.Handle
            if (-not $p.WaitForExit(180000)) {
              $p.Kill()
              throw "Smoke test ($($case.Name)) did not exit within 3 minutes"
            }
            $report = Join-Path $case.Dir "smoke_test_report.txt"
            Write-Host "--- $($case.Name): exit code $($p.ExitCode)"
            if (Test-Path $report) { Get-Content $report | Write-Host } else { Write-Host "(no report written)" }
            if ($p.ExitCode -ne 0) { $failed = $true }
          }
          if (Test-Path (Join-Path $env:APPDATA "Rustgram")) { throw "The smoke test touched the default profile" }
          if ($failed) { throw "Release smoke test failed" }

      - name: Upload test build files
        if: steps.meta.outputs.publish != 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rustgram-test-build-${{ steps.meta.outputs.version }}
          retention-days: 7
          path: |
            dist/Rustgram-Setup-${{ steps.meta.outputs.version }}-win-x64.exe
            dist/rustgram-${{ steps.meta.outputs.version }}-win-x64-portable.zip
            dist/SHA256SUMS.txt

      - name: Attest build provenance
        if: steps.meta.outputs.publish == 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/Rustgram-Setup-${{ steps.meta.outputs.version }}-win-x64.exe
            dist/rustgram-${{ steps.meta.outputs.version }}-win-x64-portable.zip
            dist/rustgram-${{ steps.meta.outputs.version }}-win-x64.tupdate

      - name: Create Draft GitHub Release
        if: steps.meta.outputs.publish == 'true'
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: Rustgram ${{ steps.meta.outputs.tag }}
          draft: true
          prerelease: ${{ steps.meta.outputs.prerelease }}
          body_path: ${{ steps.notes.outputs.path }}
          generate_release_notes: false
          fail_on_unmatched_files: true
          files: |
            dist/Rustgram-Setup-${{ steps.meta.outputs.version }}-win-x64.exe
            dist/rustgram-${{ steps.meta.outputs.version }}-win-x64-portable.zip
            dist/rustgram-${{ steps.meta.outputs.version }}-win-x64.tupdate
            dist/SHA256SUMS.txt
