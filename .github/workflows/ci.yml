name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # Only superseded pull-request runs are cancelled; every main commit keeps its own result.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  windows:
    name: Windows (x86_64-pc-windows-msvc)
    runs-on: windows-latest
    env:
      # The tg-app* crates build at opt-level 0 in dev; their test threads overflow the default 2 MB stack.
      RUST_MIN_STACK: "16777216"
      # Runners have no audio device; tests must not open real audio output.
      RUSTGRAM_HEADLESS_AUDIO: "1"
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust stable toolchain
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo registry and build artifacts
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          # Keep compiled dependencies even when clippy or tests fail, so the next run starts warm.
          cache-on-failure: true

      - name: Setup FFmpeg shared development build
        uses: ./.github/actions/setup-ffmpeg

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run workspace tests
        run: cargo test --workspace

      - name: Build release binaries
        env:
          RUSTGRAM_API_ID: ${{ secrets.RUSTGRAM_API_ID }}
          RUSTGRAM_API_HASH: ${{ secrets.RUSTGRAM_API_HASH }}
        run: cargo build --release -p tg-app -p tg-updater

      - name: Upload release executables
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rustgram-windows-x64
          path: |
            target/release/rustgram.exe
            target/release/rustgram-updater.exe
          if-no-files-found: error
          retention-days: 14

  # Lints and tests the crates that need neither the Windows desktop app (tg-app*, tg-platform) nor native
  # media libraries (FFmpeg: tg-video, tg-ui, tg-editor; ALSA: tg-audio, tg-voip). The Windows job covers those.
  ubuntu-core:
    name: Ubuntu (platform-independent crates)
    runs-on: ubuntu-latest
    env:
      EXCLUDE_CRATES: >-
        --exclude tg-app --exclude tg-app-core --exclude tg-app-history --exclude tg-app-info
        --exclude tg-app-live --exclude tg-app-media --exclude tg-app-settings --exclude tg-app-window
        --exclude tg-platform --exclude tg-audio --exclude tg-voip --exclude tg-video --exclude tg-editor
        --exclude tg-ui
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust stable toolchain
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo registry and build artifacts
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          # Keep compiled dependencies even when clippy or tests fail, so the next run starts warm.
          cache-on-failure: true

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy (platform-independent crates)
        run: cargo clippy --workspace $EXCLUDE_CRATES --all-targets -- -D warnings

      - name: Run tests (platform-independent crates)
        run: cargo test --workspace $EXCLUDE_CRATES

  # RustSec advisories, GPL-3.0 compatible licenses, registry sources (deny.toml).
  deny:
    name: Dependencies (cargo-deny)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check advisories, licenses, bans and sources
        uses: EmbarkStudios/cargo-deny-action@81891abc19297b21343b15ef67dc61e4aea74fda # v2
        with:
          command: check
