# Creates or updates the repository labels listed in .github/labels.yml. Labels that are not in the
# file are left alone; nothing is ever deleted.
name: Sync labels

on:
  push:
    branches: [main]
    paths:
      - .github/labels.yml
      - .github/workflows/labels.yml
  workflow_dispatch:

permissions: {}

concurrency:
  group: sync-labels
  cancel-in-progress: false

jobs:
  sync:
    name: Sync labels from .github/labels.yml
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      issues: write # create and update labels
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/labels.yml
          sparse-checkout-cone-mode: false

      - name: Create or update labels
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # yq (mikefarah v4) and gh are preinstalled on GitHub's Ubuntu runners.
          yq -o=json -I=0 '.[]' .github/labels.yml | while IFS= read -r label; do
            name="$(jq -r '.name' <<<"$label")"
            color="$(jq -r '.color' <<<"$label")"
            description="$(jq -r '.description // ""' <<<"$label")"
            if [[ ! "$color" =~ ^[0-9a-fA-F]{6}$ ]]; then
              echo "::error::Label '$name' has an invalid color '$color'"
              exit 1
            fi
            gh label create "$name" --color "$color" --description "$description" --force
          done
