version: 2
updates:
  # Keeps the SHA-pinned actions in .github/workflows current (one grouped PR a week).
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # Wait a week after an action release before proposing it (time for a bad release to be pulled).
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: ci
