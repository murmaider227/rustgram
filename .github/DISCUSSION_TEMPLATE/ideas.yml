title: "[Idea] "
body:
  - type: markdown
    attributes:
      value: |
        Ideas and feature requests live here. Something that is broken or looks different from Telegram Desktop
        is a bug: please use the [bug report form](https://github.com/murmaider227/rustgram/issues/new/choose) instead.
  - type: textarea
    id: what
    attributes:
      label: What should Rustgram do?
    validations:
      required: true
  - type: textarea
    id: tdesktop
    attributes:
      label: How Telegram Desktop does it (if it does)
  - type: textarea
    id: why
    attributes:
      label: Why it matters to you
