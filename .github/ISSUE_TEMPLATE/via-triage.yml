name: Triage report
description: Filed with the help of your own coding agent, following docs/TRIAGE_PLAYBOOK.md. For a hand-written report use "Bug report".
labels: ["via-triage", "needs triage"]
body:
  - type: markdown
    attributes:
      value: |
        This form follows [the triage playbook](https://github.com/murmaider227/rustgram/blob/main/docs/TRIAGE_PLAYBOOK.md)
        that coding agents use. One problem per issue. Before you submit, read the whole report yourself:
        it must not contain phone numbers, names, usernames, chat titles, message text, your Windows user
        name in paths, or anything from a `tdata` folder other than redacted crash-report lines.
        Security problems go to a [private report](https://github.com/murmaider227/rustgram/security/advisories/new) instead.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: The problem in the reporter's own words.
    validations:
      required: true

  - type: textarea
    id: diagnosis
    attributes:
      label: Diagnosis
      description: What the investigation found, grounded in logs and source (file and function names).
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Minimal, deterministic steps, if found. Otherwise say how often it happens.
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Rustgram version
      description: The version the bug happened on (file properties of rustgram.exe or the bottom of the main menu), or "unknown".
      placeholder: 0.1.0-alpha.2
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Environment
      description: Windows version, install type (installer, portable zip, package manager, source), anything else relevant.
      placeholder: Windows 11 24H2, portable zip, 150% scaling
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: The few most relevant log or crash-report lines only, redacted.
      render: text

  - type: input
    id: related
    attributes:
      label: Related issues
      description: Existing issues that look similar, and why this is not a duplicate.

  - type: textarea
    id: workaround
    attributes:
      label: Fix applied or workaround
      description: Anything that was run on the computer to unblock the reporter.

  - type: input
    id: agent
    attributes:
      label: Filed by
      description: Which agent and model wrote this report.
      placeholder: Claude Code, Claude Opus 5.5
    validations:
      required: true

  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I (the person, not the agent) read the whole report, and it contains no private data.
          required: true
