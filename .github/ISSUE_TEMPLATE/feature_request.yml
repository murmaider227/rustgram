name: Feature request
description: Something Telegram Desktop has that Rustgram is missing, or an idea.
labels: ["enhancement"]
body:
  - type: textarea
    id: what
    attributes:
      label: What should Rustgram do?
    validations:
      required: true
  - type: textarea
    id: tdesktop
    attributes:
      label: How Telegram Desktop does it (if it does)
  - type: textarea
    id: why
    attributes:
      label: Why it matters to you
